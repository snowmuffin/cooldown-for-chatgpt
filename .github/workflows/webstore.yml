name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'status: check connection; upload: ZIP only; publish: upload and submit for review'
        type: choice
        options: [status, upload, publish]
        default: status
        required: true
      version:
        description: 'Exact manifest version to upload (required for upload/publish)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  webstore:
    name: Store connection and release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run tests
        run: |
          node test/retry-after.test.js
          node test/common.test.js
          node test/background.test.js
          node test/i18n.test.js
          node test/icons.test.js
          node test/webstore.test.js
      - name: Build and validate ZIP
        if: inputs.operation != 'status'
        run: |
          node scripts/package.cjs
          unzip -t dist/cooldown-for-chatgpt-*.zip
      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Run store operation
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_OPERATION: ${{ inputs.operation }}
          CWS_EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/webstore.cjs
