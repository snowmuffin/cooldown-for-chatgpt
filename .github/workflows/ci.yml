name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run dependency-free tests
        run: |
          node test/retry-after.test.js
          node test/common.test.js
          node test/background.test.js
          node test/i18n.test.js
          node test/icons.test.js
          node test/webstore.test.js
      - name: Build extension ZIP
        run: node scripts/package.cjs
      - name: Verify ZIP integrity
        run: unzip -t dist/cooldown-for-chatgpt-*.zip
